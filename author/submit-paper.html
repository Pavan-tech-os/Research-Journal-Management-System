<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Submit Paper</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .sidebar {
            position: fixed;
            width: 240px;
            height: 100vh;
            background: #163f6f;
            color: white;
            padding: 25px 15px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            padding: 0 15px 30px;
            border-bottom: 1px solid #31577f;
        }

        .menu {
            margin-top: 30px;
        }

        .menu a {
            display: block;
            color: #dce7f3;
            text-decoration: none;
            padding: 13px 15px;
            margin-bottom: 5px;
            border-radius: 5px;
            font-size: 14px;
        }

        .menu a:hover,
        .menu a.active {
            background: #24578f;
            color: white;
        }

        .main {
            margin-left: 240px;
            padding: 35px 45px;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 26px;
        }

        .page-header p {
            color: #777;
            font-size: 13px;
            margin-top: 7px;
        }

        .form-box {
            background: white;
            border: 1px solid #e1e5eb;
            border-radius: 8px;
            padding: 30px;
            max-width: 900px;
        }

        .form-section {
            margin-bottom: 28px;
        }

        .form-section h2 {
            font-size: 17px;
            color: #163f6f;
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd3dc;
            border-radius: 5px;
            outline: none;
            font-size: 13px;
            font-family: Arial;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #163f6f;
        }

        textarea {
            height: 130px;
            resize: vertical;
        }

        .upload-box {
            border: 2px dashed #cbd5e1;
            padding: 30px;
            text-align: center;
            border-radius: 7px;
            background: #fafcff;
        }

        .upload-box p {
            color: #777;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .upload-box input {
            border: none;
            width: auto;
        }

        .buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 22px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 13px;
        }

        .cancel {
            background: #edf1f5;
            color: #444;
        }

        .submit {
            background: #163f6f;
            color: white;
        }

        @media(max-width: 700px) {

            .sidebar {
                width: 70px;
            }

            .logo {
                font-size: 0;
            }

            .menu a {
                font-size: 0;
                text-align: center;
            }

            .main {
                margin-left: 70px;
                padding: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }

    </style>

</head>


<body>


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            📚 Research Journal
        </div>

        <div class="menu">

            <a href="dashboard.html">
                🏠 Dashboard
            </a>

            <a href="submit-paper.html"
               class="active">
                📄 Submit Paper
            </a>

            <a href="submissions.html">
                📋 My Submissions
            </a>

            <a href="revisions.html">
                🔄 Revisions
            </a>

            <a href="../index.html">
                🚪 Logout
            </a>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <div class="page-header">

            <h1>Submit Research Paper</h1>

            <p>
                Enter your research paper details and upload your manuscript.
            </p>

        </div>


        <div class="form-box">

            <form id="paperForm">


                <!-- PAPER INFORMATION -->

                <div class="form-section">

                    <h2>Paper Information</h2>

                    <div class="form-group">

                        <label>
                            Paper Title *
                        </label>

                        <input
                            type="text"
                            id="title"
                            placeholder="Enter research paper title"
                            required
                        >

                    </div>


                    <div class="form-row">

                        <div class="form-group">

                            <label>
                                Research Area *
                            </label>

                            <select required>

                                <option value="">
                                    Select research area
                                </option>

                                <option>
                                    Artificial Intelligence
                                </option>

                                <option>
                                    Machine Learning
                                </option>

                                <option>
                                    Data Science
                                </option>

                                <option>
                                    Cyber Security
                                </option>

                                <option>
                                    Internet of Things
                                </option>

                                <option>
                                    Other
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label>
                                Keywords *
                            </label>

                            <input
                                type="text"
                                placeholder="AI, ML, Healthcare"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label>
                            Abstract *
                        </label>

                        <textarea
                            placeholder="Enter the abstract of your research paper"
                            required
                        ></textarea>

                    </div>

                </div>


                <!-- AUTHOR INFORMATION -->

                <div class="form-section">

                    <h2>Author Information</h2>

                    <div class="form-row">

                        <div class="form-group">

                            <label>
                                Author Name *
                            </label>

                            <input
                                type="text"
                                placeholder="Enter author name"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label>
                                Email *
                            </label>

                            <input
                                type="email"
                                placeholder="Enter email"
                                required
                            >

                        </div>

                    </div>

                </div>


                <!-- FILE UPLOAD -->

                <div class="form-section">

                    <h2>Upload Manuscript</h2>

                    <div class="upload-box">

                        <p>
                            📄 Upload your research paper
                        </p>

                        <p>
                            Supported formats: PDF, DOC, DOCX
                        </p>

                        <input
                            type="file"
                            accept=".pdf,.doc,.docx"
                            required
                        >

                    </div>

                </div>


                <!-- BUTTONS -->

                <div class="buttons">

                    <button
                        type="reset"
                        class="btn cancel">
                        Clear
                    </button>

                    <button
                        type="submit"
                        class="btn submit">
                        Submit Paper
                    </button>

                </div>


            </form>

        </div>

    </main>


    <script>

        document
        .getElementById("paperForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            alert(
                "Research paper submitted successfully!"
            );

            this.reset();

        });

    </script>

</body>
</html>
